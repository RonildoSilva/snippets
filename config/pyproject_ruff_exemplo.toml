[tool.ruff]
exclude = ["alembic"]
line-length = 90
indent-width = 4
show-fixes = true

[tool.ruff.format]
line-ending = "lf"
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
extend-select = [
    # PEP-8 and Flake8
    "A", # builtins
    "ANN", # annotations
    "ARG", # unused arguments
    "ASYNC", # flake8-async
    "BLE", # blind-except
    "C4", # comprehensions
    "DTZ", # datetime timezone
    "FBT", # boolean-trap
    "G", # flake8-logging-format
    "I", # isort
    "INP", # implicit-namespace-package
    "ISC", # implicit-str-concat
    "N", # naming
    "PIE", # flake8-pie
    "PT", # flake8-pytest
    "PTH", # flake8-pathlib
    "PYI", # flake-8pyi
    "RET", # flake8-return
    "RSE", # flake8-raise
    "RUF", # ruff
    "S", # bandit
    "SIM", # flake8-simplify
    "SLF", # flake8-self
    "T10", # debugger
    "T20", # prints
    "TCH", # flake8-type-checking
    "TID", # tidy imports

    # Bugs and errors
    "B", # bugbear
    "E", # pycodestyle errors
    "F", # pyflakes
    "PL", # pylint

    # Other
    "C90", # mccabe complexity
    "ERA", # commented out code
    "UP", # pyupgrade
    "W", # pycodestyle warnings
    ]
ignore = [
    "ANN101", # deprecated annotation rule
    "ANN102", # deprecated annotation rule
    "N818", # exception naming suffix
    "E501", # formatter conflict
    "W191", # formatter conflict
    "ISC001", # formatter conflict
    "RUF012", # lots of false positives for pydantic
    ]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = [
    "F403", # preload all models
    "PLC0414" # used in __init__.py to export modules
    ]
"tests/*" = [
    "S101", # assert used
    "ANN201", # test function return
    "ANN401", # type Any
    "ARG001", # unused argument for mocker
    "PLR0913", # pytest fixture as arguments
    "FBT001", # boolean fixtures
    "F811", # imported fixtures
    ]

[tool.ruff.lint.isort]
known-first-party = ["galp"]
case-sensitive = true
combine-as-imports = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.pycodestyle]
max-line-length = 90

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-dummy-args = true